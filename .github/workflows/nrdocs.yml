name: Publish Docs (nrdocs)

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install nrdocs CLI
        run: |
          git clone https://github.com/noam-r/nrdocs.git /tmp/nrdocs
          cd /tmp/nrdocs
          npm install -g pnpm
          pnpm install
          pnpm build
          pnpm link --global --dir packages/cli

      - name: Publish docs
        run: nrdocs publish --docs-dir docs
        env:
          NRDOCS_API_URL: nrdocs2.quinovi.com
